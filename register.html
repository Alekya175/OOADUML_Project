{% extends "base.html" %}

{% block title %}Create Account | Apex Drive{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 520px;">
    <div class="auth-header">
      <div class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon">▲</div>
        <span>APEX<span class="accent">DRIVE</span></span>
      </div>
      <h1>Create an Account</h1>
      <p>Register as a customer to reserve vehicles instantly</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      <div class="form-group">
        <label for="full_name" class="form-label">Full Name</label>
        <input type="text" name="full_name" id="full_name" class="input-control" placeholder="e.g. Rahul Sharma" value="{{ full_name or '' }}" required autofocus>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" name="username" id="username" class="input-control" placeholder="rahuls" value="{{ username or '' }}" required minlength="3">
        </div>
        <div class="form-group">
          <label for="phone" class="form-label">Mobile Number</label>
          <input type="tel" name="phone" id="phone" class="input-control" placeholder="+91 98765 43210" value="{{ phone or '' }}">
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" name="email" id="email" class="input-control" placeholder="rahul.sharma@example.in" value="{{ email or '' }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" name="password" id="password" class="input-control" placeholder="Min. 6 chars" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" class="input-control" placeholder="Repeat password" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Register Account &rarr;
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dim);">
        Already have an account? 
        <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign in here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
