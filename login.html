{% extends "base.html" %}

{% block title %}Sign In | Apex Drive{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon">▲</div>
        <span>APEX<span class="accent">DRIVE</span></span>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to manage your reservations or fleet</p>
    </div>

    <!-- Quick Demo Accounts Box -->
    <div class="quick-fill-box">
      <p>⚡ 1-Click Demo Login</p>
      <div class="quick-fill-btns">
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('customer', 'Customer@123')">
          👤 Customer Demo
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('admin', 'Admin@123')">
          🛡️ Admin Demo
        </button>
      </div>
    </div>

    <form action="{{ url_for('auth.login', next=next) }}" method="POST">
      <input type="hidden" name="next" value="{{ next or '' }}">

      <div class="form-group">
        <label for="login_id" class="form-label">Username or Email</label>
        <input type="text" name="login_id" id="login_id" class="input-control" placeholder="admin or customer" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="input-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Sign In &rarr;
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dim);">
        Don't have an account yet? 
        <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Create an account</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
